name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# halftone-tokens warns on contrast by default; Halftone's own kits build strict, so a pairing below WCAG AA
# (or a tone's text on a tint the palette can't carry) fails every job here. The published 1.1.0 ignores it.
env:
  HALFTONE_STRICT: '1'

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # One install for the whole monorepo (npm workspaces, root lockfile).
      - run: npm ci
        working-directory: .

      # NativeWind 4 needs Tailwind 3; apps/docs and apps/web bring Tailwind 4. The root pins v3 so it
      # hoists. If an install ever flips that, fail here rather than at bundle time.
      - name: NativeWind resolves Tailwind 3
        run: node -e "const v=require(require.resolve('tailwindcss/package.json',{paths:[require.resolve('nativewind')]})).version; if(!v.startsWith('3.')){console.error('nativewind resolves tailwindcss '+v);process.exit(1)}; console.log('tailwindcss', v)"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      # The halftone/* guardrail rules (eslint/halftone.mjs) and which files the config points them at.
      - name: Lint rules
        run: npm run lint:rules

      # Fails if any colour pairing drops below WCAG AA (strict, see env above), or if tokens.json changed
      # without the generated files (global.css, lib/theme.ts, web.css, DESIGN.md, …) being rebuilt and committed.
      - name: Tokens are built and pass the contrast check
        run: npm run tokens:check

      # Every ui/kit file is registered and exports what registry/components.ts says, and the
      # generated DESIGN_SYSTEM.md tables, llms.txt and registry.json are committed.
      - name: Registry is consistent and generated docs are current
        run: npm run registry:build -- --check

      # The published shadcn registry reinstalls every component and lib file identically.
      - name: Registry builds and round-trips
        run: npm run registry:dist && npm run registry:roundtrip

      - name: Web bundle builds
        run: npm run export:web

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      # One brand: apps/web/tokens/tokens.json must be a copy of apps/mobile's.
      - name: Tokens in step with the mobile kit
        run: npm run tokens:sync -- --check
        working-directory: .

      # One set of guardrails: the halftone/* rules and the lint-on-edit hook are copies of apps/mobile's.
      - name: Lint rules in step with the mobile kit
        run: npm run lint:sync -- --check
        working-directory: .

      - name: Tokens are built and pass the contrast check
        run: npm run tokens:check

      - name: Registry is consistent and generated docs are current
        run: npm run registry:build -- --check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint rules
        run: npm run lint:rules

      - name: Build
        run: npm run build

      # The published shadcn registry reinstalls every kit file identically (unchanged shadcn items come
      # from ui.shadcn.com).
      - name: Registry builds and round-trips
        run: npm run registry:dist && npm run registry:roundtrip

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: halftone-tokens tests
        run: npm test -w packages/tokens

      - name: Package contents
        run: npm pack -w packages/tokens --dry-run

  # Each app must work when copied out on its own (npx giget gh:itsHendri/halftone/apps/<app>): no root
  # lockfile, no root overrides, no workspace links. The tokens package comes from a packed tarball of this
  # commit (`pack`), and again from npm (`published`): what someone copying the app out today installs. The
  # published leg fails if an app starts to need tokens-package code that hasn't been released, so it is skipped
  # while .changeset/ holds unreleased changesets (npm is known to lag then) and comes back once they are released.
  extract:
    name: extract (${{ matrix.app }}${{ matrix.tokens == 'published' && ', published tokens' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile
            tokens: pack
            setup: --yes --name "Acme Field" --app-id com.acme.field --theme calm --no-eas-init
            checks: npm run tokens:check && npm run registry:build -- --check && npm run typecheck && npm run lint -- --max-warnings 0 && npm run lint:rules && npm run export:web
            after-eject: npm run typecheck && npm run lint -- --max-warnings 0
          - app: web
            tokens: pack
            setup: --yes --name "Acme Portal" --theme calm
            checks: npm run tokens:check && npm run registry:build -- --check && npm run typecheck && npm run lint && npm run lint:rules && npm run build
            after-eject: npm run typecheck && npm run lint
          - app: mobile
            tokens: published
            setup: --yes --name "Acme Field" --app-id com.acme.field --theme calm --no-eas-init
            checks: npm run tokens:check && npm run typecheck && npm run lint -- --max-warnings 0 && npm run lint:rules
            after-eject: npm run typecheck && npm run lint -- --max-warnings 0
          - app: web
            tokens: published
            setup: --yes --name "Acme Portal" --theme calm
            checks: npm run tokens:check && npm run typecheck && npm run lint && npm run lint:rules
            after-eject: npm run typecheck && npm run lint
    steps:
      - uses: actions/checkout@v7

      - name: Unreleased changesets (the published leg waits for the release)
        id: pending
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ "${{ matrix.tokens }}" = published ] && [ "$pending" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped: $pending unreleased changeset(s), so npm's @halftone-ds/tokens is behind this commit. Runs again after the release."
          fi

      - uses: actions/setup-node@v7
        if: steps.pending.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Copy apps/${{ matrix.app }} out of the monorepo
        if: steps.pending.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD:apps/${{ matrix.app }} | tar -x -C "$RUNNER_TEMP/app"
          if [ "${{ matrix.tokens }}" = pack ]; then
            npm pack -w packages/tokens --pack-destination "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/app"
            npm pkg set "devDependencies.@halftone-ds/tokens=file:$(ls "$RUNNER_TEMP"/halftone-ds-tokens-*.tgz)"
          fi

      - name: Install the standalone app
        if: steps.pending.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/app
        run: npm install --no-audit --no-fund

      - name: Checks pass standalone
        if: steps.pending.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.checks }}

      # The first things a real project does, on the throwaway copy so they can be destructive: setup without
      # questions (rename, .env.local, a theme with its fonts; no eas init), then the samples go, then the gates.
      - name: Setup runs without questions
        if: steps.pending.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/app
        run: npm run setup -- ${{ matrix.setup }}

      - name: Samples eject cleanly
        if: steps.pending.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/app
        run: npm run eject-samples && ${{ matrix['after-eject'] }}

  # A Studio system with an override of every kind (packages/tokens/test/fixtures/every-override.halftone.json: edited
  # steps and seeds, roles, text styles, a Google font outside the picks, corners, shadows, borders, every kind of
  # extra, all four components) applied to each kit copied out, then every gate. extract only applies a theme code;
  # a system with overrides is what Studio's Use system hands most people, and it once broke typecheck (1.3.0).
  system-apply:
    name: system apply (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile
            checks: npm run tokens:check && npm run registry:build -- --check && npm run typecheck && npm run lint -- --max-warnings 0 && npm run lint:rules && npm run export:web
          - app: web
            checks: npm run tokens:check && npm run registry:build -- --check && npm run typecheck && npm run lint && npm run lint:rules && npm run build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Copy apps/${{ matrix.app }} out, with this commit's halftone-tokens
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD:apps/${{ matrix.app }} | tar -x -C "$RUNNER_TEMP/app"
          npm pack -w packages/tokens --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/app"
          npm pkg set "devDependencies.@halftone-ds/tokens=file:$(ls "$RUNNER_TEMP"/halftone-ds-tokens-*.tgz)"

      - name: Install the standalone app
        working-directory: ${{ runner.temp }}/app
        run: npm install --no-audit --no-fund

      # As the apply-theme skill does it: the CLI writes tokens.json, installs the fonts, rebuilds the tokens and
      # the registry.
      - name: Apply the every-override system
        working-directory: ${{ runner.temp }}/app
        run: npx halftone-tokens theme apply "$GITHUB_WORKSPACE/packages/tokens/test/fixtures/every-override.halftone.json"

      - name: Every gate passes on it
        working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.checks }}

  # The samples go one at a time on real projects, so each one ejects on its own (and all of them together),
  # and every gate that could notice a dangling reference runs on what is left, bundle included. The extract
  # job above ejects everything from a standalone copy; this one covers the partial ejects.
  eject:
    name: eject (${{ matrix.app }}, ${{ matrix.samples }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: mobile, samples: all }
          - { app: mobile, samples: shop }
          - { app: mobile, samples: habits }
          - { app: mobile, samples: northwind }
          - { app: web, samples: all }
          - { app: web, samples: northwind }
          - { app: web, samples: dashboard landing }
          - { app: web, samples: assistant }
          - { app: web, samples: shop }
          - { app: web, samples: habits }
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      # Through setup, as a new project does it (its --eject runs eject-samples; no theme in the monorepo, no eas init).
      - name: Eject ${{ matrix.samples }}
        run: npm run setup -- --yes --name "Acme Test" --eject "${{ matrix.samples }}" ${{ matrix.app == 'mobile' && '--no-eas-init' || '' }} && npm run eject-samples -- --status

      - name: Gates pass on what is left
        run: |
          if [ "${{ matrix.app }}" = mobile ]; then
            npm run typecheck && npm run lint -- --max-warnings 0 && npm run lint:rules && npm run registry:build -- --check && npm run export:web
          else
            npm run typecheck && npm run lint && npm run lint:rules && npm run registry:build -- --check && npm run build
          fi

  # The docs site: tokens, generated content, both kits' exports (mobile under /m, web under /w), both
  # registries under /r, the static Next export, then every internal link, accessibility and the TypeScript.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        working-directory: .

      - name: Build the site
        run: npm run build

      - name: Internal links resolve
        run: npm run check:links

      # WCAG 2.1 AA with axe-core, every key page in light and dark, the web kit's frames included.
      - name: Chromium for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, light and dark)
        run: npm run check:a11y

      - name: Typecheck
        run: npm run typecheck

      - name: Brand asset tests
        run: npm test
